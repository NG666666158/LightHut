# 挚友树洞：Spring Boot + MySQL（默认）
#
# 准备：复制 .env.example 为 .env 并修改密码
# 启动：docker compose up -d --build
# 带 Nginx（80 反代 Thymeleaf 整站）：docker compose --profile nginx up -d --build
# Vue SPA（需先 web 目录 npm run build）：docker compose --profile nginx-vue up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: hollow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hollow
      MYSQL_USER: hollow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    image: hollow:1.0.0
    container_name: hollow-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql,docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hollow?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: hollow
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: UTC
      APP_STARLIGHT_UPLOAD_DIR: /app/uploads/starlight
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: hollow-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/thymeleaf.conf:/etc/nginx/conf.d/default.conf:ro

  nginx-vue:
    profiles: ["nginx-vue"]
    image: nginx:alpine
    container_name: hollow-nginx-vue
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/vue-spa.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro

volumes:
  mysql_data:

# =============================================================================
# MySQL 配置模板
# -----------------------------------------------------------------------------
# 使用方式：
#   1. 复制本文件为 application-mysql.properties（勿将含真实密码的文件提交到公开仓库）
#   2. 修改下方 url / username / password
#   3. 启动时增加：--spring.profiles.active=mysql
# =============================================================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hollow?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=hollow
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

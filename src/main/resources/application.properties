# ===============================
# 基础运行配置（可按需修改）
# ===============================

# 项目启动端口，默认 8080。
# 你可以改为 8081、9090 等任意未被占用端口。
server.port=8080

# 关闭 Thymeleaf 模板缓存，方便开发时实时看到页面改动。
# 上线时建议改为 true，提升性能。
spring.thymeleaf.cache=false

# ---------- Spring Boot DevTools（随代码/模板变更自动重启）----------
# 使用方式：优先用「mvn spring-boot:run」启动（DevTools 在 classpath 里才会生效）。
# 若因项目路径含中文导致 spring-boot:run 找不到主类，请用 IDE 运行 HollowApplication.main，
# 或将项目放到纯英文路径后再执行 mvn spring-boot:run。
# 打出来的可执行 jar 默认不含 DevTools；日常改页面请用上述方式之一，不要用 java -jar 指望热重启。
# 可选：另开终端执行 scripts/dev-watch-compile.ps1，在 spring-boot:run 模式下保存 .java 会自动 compile 触发重启。
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=false

# 页面编码配置，防止中文乱码。
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.messages.encoding=UTF-8

# 情绪树洞首页展示（中文使用 \\u 转义，符合 Java Properties 规范，避免 ISO-8859-1 读取时乱码）
app.home.nickname=\u918b\u9178\u94a0
# 左侧栏第二行（与各页一致）
app.home.sidebar-subtitle=\u4eca\u65e5\u5fc3\u60c5\uff1a\u5b81\u9759
# 左侧栏头像（相对站点根路径，置于 classpath:/static/）
app.home.avatar-url=/images/profile-avatar.png
app.home.encouragement-text=\u4f60\u4eca\u5929\u770b\u8d77\u6765\u5f88\u6e29\u67d4\u3002
app.home.encouragement-signature=\u6765\u81ea\u918b\u9178\u94a0\u7684\u533f\u540d\u4fbf\u7b7e
app.home.daily-meditation-bg=https://lh3.googleusercontent.com/aida-public/AB6AXuAsCV0ff_FI2wGsKGUo5crmvkzp7_nY_Ef3q7bcY0gBHKgJstYYw2KaPox0Y4nac8eEodK5XWn2KiYI6sWSHribopV3G23SrQ8P67MHdfehNmje_ghyO8e4r44-1kW6oEOpIG_CD7VMT2DNUeAvNKjzCr2w7K6j_QZvd8i3XZkiopSZGi2i1OVguAqeLcJpotcvycC9AyW1w_NL2GT93qaE_S8zeyszU9nPOY2HWCH3JN-Ul91M7fS70y7x_Kq6jiaDkCxbiMBV3mA

# 星光墙本地上传目录（相对路径基于进程工作目录，jar 运行时建议在 jar 同目录下放 uploads）
app.starlight.upload-dir=uploads/starlight

# 上传大小限制（单文件与整请求）
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# 数据源与 JPA（默认 H2 文件库 ./data/hollow）
# 切换 MySQL：复制 application-mysql.example.properties 为 application-mysql.properties 后启动
#   --spring.profiles.active=mysql
# 详见 docs/mysql-migration-plan.md
# Docker 部署：docs/docker-deploy.md
# ===============================
spring.datasource.url=jdbc:h2:file:./data/hollow;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

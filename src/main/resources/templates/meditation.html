<!DOCTYPE html>
<html class="light" lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"/>
    <title>冥想 - 挚友专属・治愈树洞备忘录</title>
    <th:block th:replace="~{fragments/common-head :: coreDeps()}"></th:block>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fffcf7;
            color: #373831;
        }
        .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #medBreathCore {
            transform: scale(1);
            transition-property: transform;
            transition-timing-function: ease-in-out;
        }
        .med-noise-card.is-selected {
            box-shadow: 0 0 0 2px rgba(147, 82, 82, 0.45), 0 8px 28px rgba(147, 82, 82, 0.12);
            border-color: rgba(147, 82, 82, 0.35);
        }
    </style>
</head>
<body class="flex min-h-screen w-full max-w-full flex-col overflow-x-hidden bg-background font-body text-on-surface selection:bg-primary-fixed selection:text-on-primary-container lg:flex-row">
<nav th:replace="~{fragments/layout :: sidebar('meditation')}"></nav>

<main class="relative flex min-h-screen min-w-0 w-full flex-1 flex-col overflow-y-auto bg-surface lg:ml-72">
    <header th:replace="~{fragments/layout :: topbar(activeTopNav='meditation')}"></header>

    <section class="relative flex min-h-0 w-full flex-1 flex-col px-4 py-8 sm:px-8 lg:px-12 xl:px-20 lg:py-12">
        <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden">
            <div class="absolute top-1/4 right-1/4 h-[min(500px,80vw)] w-[min(500px,80vw)] rounded-full bg-primary/5 blur-[100px]"></div>
            <div class="absolute bottom-1/4 left-1/4 h-[min(600px,90vw)] w-[min(600px,90vw)] rounded-full bg-secondary/5 blur-[120px]"></div>
        </div>

        <!-- 与首页问候区一致：大标题 + 装饰线 + 副文案 -->
        <div class="mb-10 space-y-4 lg:mb-14">
            <h1 class="font-headline text-3xl font-extrabold leading-tight tracking-tight text-on-surface sm:text-4xl md:text-5xl lg:text-6xl">
                深呼吸冥想指南
            </h1>
            <div class="flex items-center space-x-4">
                <div class="h-[1px] w-12 shrink-0 bg-primary/30"></div>
                <p class="max-w-2xl text-base font-body font-medium italic text-secondary-dim sm:text-lg md:text-xl">
                    闭上双眼，跟随圆环的起伏，感受呼吸的节奏与内心的平静。
                </p>
            </div>
        </div>

        <div class="flex w-full flex-col items-center gap-10 sm:gap-12">
            <div class="relative flex h-[min(19rem,78vw)] w-[min(19rem,78vw)] max-w-[22rem] items-center justify-center sm:h-[22rem] sm:w-[22rem] sm:max-w-none md:h-96 md:w-96">
                <div class="absolute inset-0 scale-110 animate-pulse rounded-full bg-primary/5"></div>
                <div class="absolute inset-4 flex items-center justify-center rounded-full border border-white/40 bg-surface-container-lowest/90 shadow-lg shadow-primary/5 glass-panel md:inset-5">
                    <div id="medBreathCore"
                         class="flex h-[11.5rem] w-[11.5rem] flex-col items-center justify-center rounded-full bg-gradient-to-tr from-primary/20 to-primary-container/40 sm:h-52 sm:w-52 md:h-56 md:w-56">
                        <span id="medBreathLabel" class="font-headline text-2xl font-bold text-primary sm:text-3xl">准备</span>
                    </div>
                </div>
            </div>

            <button type="button" id="medToggleBtn"
                    class="rounded-full bg-gradient-to-r from-primary to-primary-container px-10 py-4 font-headline text-lg font-bold text-on-primary shadow-xl shadow-primary/20 transition-transform hover:scale-[1.02] active:scale-95 sm:px-14 sm:py-5">
                开始冥想
            </button>
        </div>

        <section class="mt-16 w-full sm:mt-24">
            <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
                <h2 class="font-headline text-2xl font-bold leading-tight tracking-tight text-on-surface sm:text-3xl md:text-4xl">白噪音选择</h2>
                <span class="cursor-default text-base font-medium text-on-surface-variant sm:text-lg" title="后续可接入更多声景">更多声景筹备中</span>
            </div>
            <div class="no-scrollbar flex gap-5 overflow-x-auto scroll-smooth pb-6 sm:gap-6">
                <div class="w-40 shrink-0 sm:w-44">
                    <button type="button" class="med-noise-card group flex h-44 w-full cursor-pointer flex-col items-center justify-center gap-4 rounded-xl border border-outline-variant/10 bg-surface-container-low transition-all hover:bg-surface-container-high glass-panel sm:h-48"
                            data-noise="rain" aria-pressed="false">
                        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-blue-50 sm:h-[4.5rem] sm:w-[4.5rem]">
                            <span class="material-symbols-outlined text-4xl text-blue-400 sm:text-[2.75rem]">water_drop</span>
                        </div>
                        <span class="text-base font-semibold text-on-surface sm:text-lg">细雨声</span>
                    </button>
                </div>
                <div class="w-40 shrink-0 sm:w-44">
                    <button type="button" class="med-noise-card group flex h-44 w-full cursor-pointer flex-col items-center justify-center gap-4 rounded-xl border border-outline-variant/10 bg-surface-container-low transition-all hover:bg-surface-container-high glass-panel sm:h-48"
                            data-noise="forest" aria-pressed="false">
                        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-secondary-fixed/80 sm:h-[4.5rem] sm:w-[4.5rem]">
                            <span class="material-symbols-outlined text-4xl text-secondary sm:text-[2.75rem]">forest</span>
                        </div>
                        <span class="text-base font-semibold text-on-surface sm:text-lg">林间晨曦</span>
                    </button>
                </div>
                <div class="w-40 shrink-0 sm:w-44">
                    <button type="button" class="med-noise-card group flex h-44 w-full cursor-pointer flex-col items-center justify-center gap-4 rounded-xl border border-outline-variant/10 bg-surface-container-low transition-all hover:bg-surface-container-high glass-panel sm:h-48"
                            data-noise="waves" aria-pressed="false">
                        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-cyan-50 sm:h-[4.5rem] sm:w-[4.5rem]">
                            <span class="material-symbols-outlined text-4xl text-cyan-500 sm:text-[2.75rem]">waves</span>
                        </div>
                        <span class="text-base font-semibold text-on-surface sm:text-lg">海浪拍岸</span>
                    </button>
                </div>
                <div class="w-40 shrink-0 sm:w-44">
                    <button type="button" class="med-noise-card group flex h-44 w-full cursor-pointer flex-col items-center justify-center gap-4 rounded-xl border border-outline-variant/10 bg-surface-container-low transition-all hover:bg-surface-container-high glass-panel sm:h-48"
                            data-noise="chime" aria-pressed="false">
                        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-primary-container/40 sm:h-[4.5rem] sm:w-[4.5rem]">
                            <span class="material-symbols-outlined text-4xl text-primary sm:text-[2.75rem]">notifications</span>
                        </div>
                        <span class="text-base font-semibold text-on-surface sm:text-lg">风铃微语</span>
                    </button>
                </div>
                <div class="w-40 shrink-0 sm:w-44">
                    <button type="button" class="med-noise-card group flex h-44 w-full cursor-pointer flex-col items-center justify-center gap-4 rounded-xl border border-outline-variant/10 bg-surface-container-low transition-all hover:bg-surface-container-high glass-panel sm:h-48"
                            data-noise="fire" aria-pressed="false">
                        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-orange-50 sm:h-[4.5rem] sm:w-[4.5rem]">
                            <span class="material-symbols-outlined text-4xl text-orange-400 sm:text-[2.75rem]">local_fire_department</span>
                        </div>
                        <span class="text-base font-semibold text-on-surface sm:text-lg">篝火暖意</span>
                    </button>
                </div>
            </div>
        </section>
    </section>
</main>

<script>
    (function () {
        var core = document.getElementById('medBreathCore');
        var label = document.getElementById('medBreathLabel');
        var btn = document.getElementById('medToggleBtn');
        if (!core || !label || !btn) {
            return;
        }

        var phases = [
            { t: '吸气…', ms: 4000, scale: 1.12 },
            { t: '屏息…', ms: 2200, scale: 1.12 },
            { t: '呼气…', ms: 5500, scale: 0.9 },
            { t: '屏息…', ms: 2200, scale: 0.9 }
        ];

        var running = false;
        var phaseIdx = 0;
        var timer = null;
        var medStepCount = 0;

        function clearTimer() {
            if (timer) {
                clearTimeout(timer);
                timer = null;
            }
        }

        function scheduleNext() {
            clearTimer();
            if (!running) {
                return;
            }
            var p = phases[phaseIdx];
            label.textContent = p.t;
            core.style.transitionDuration = p.ms / 1000 + 's';
            core.style.transform = 'scale(' + p.scale + ')';
            phaseIdx = (phaseIdx + 1) % phases.length;
            medStepCount++;
            timer = setTimeout(scheduleNext, p.ms);
        }

        function start() {
            running = true;
            phaseIdx = 0;
            medStepCount = 0;
            btn.textContent = '停止冥想';
            scheduleNext();
        }

        function stop() {
            running = false;
            clearTimer();
            if (medStepCount >= 4) {
                try {
                    sessionStorage.setItem('hollowMeditateJustDone', '1');
                } catch (e) { /* ignore */ }
            }
            medStepCount = 0;
            btn.textContent = '开始冥想';
            label.textContent = '准备';
            core.style.transitionDuration = '0.8s';
            core.style.transform = 'scale(1)';
            phaseIdx = 0;
        }

        btn.addEventListener('click', function () {
            if (running) {
                stop();
            } else {
                start();
            }
        });

        var cards = document.querySelectorAll('.med-noise-card');
        var selected = null;
        cards.forEach(function (card) {
            card.addEventListener('click', function () {
                if (selected === card) {
                    card.classList.remove('is-selected');
                    card.setAttribute('aria-pressed', 'false');
                    selected = null;
                    return;
                }
                if (selected) {
                    selected.classList.remove('is-selected');
                    selected.setAttribute('aria-pressed', 'false');
                }
                selected = card;
                card.classList.add('is-selected');
                card.setAttribute('aria-pressed', 'true');
            });
            card.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.click();
                }
            });
        });
    })();
</script>
</body>
</html>
